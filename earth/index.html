<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLOBAL AI PULSE — Live Intelligence</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #000;
        font-family: "Inter", sans-serif;
        color: #fff;
        cursor: default;
      }

      #globe-container {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }

      /* Top-left branding */
      .brand {
        position: fixed;
        top: 32px;
        left: 36px;
        z-index: 100;
        pointer-events: none;
      }
      .brand h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        line-height: 1.25;
        color: #fff;
      }
      .brand h1 em {
        font-style: italic;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.6);
      }

      /* Bottom-left title */
      .main-title {
        position: fixed;
        bottom: 40px;
        left: 36px;
        z-index: 100;
        pointer-events: none;
      }
      .main-title h2 {
        font-size: 48px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        line-height: 1.1;
      }
      .main-title h2 em {
        font-style: italic;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.7);
      }
      .main-title .sub {
        margin-top: 8px;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }

      /* Bottom-center foreword */
      .foreword-link {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        font-size: 10px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
        cursor: pointer;
        transition: color 0.3s;
      }
      .foreword-link:hover {
        color: #fff;
      }

      /* Navigation arrows */
      .nav-arrow {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        z-index: 100;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.5);
        font-size: 28px;
        transition: color 0.3s;
        user-select: none;
      }
      .nav-arrow:hover {
        color: #fff;
      }
      .nav-left {
        left: 20px;
      }
      .nav-right {
        right: 20px;
      }

      /* Top-right menu icon */
      .menu-icon {
        position: fixed;
        top: 32px;
        right: 36px;
        z-index: 100;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .menu-icon span {
        display: block;
        height: 2px;
        background: rgba(255, 255, 255, 0.6);
        transition: background 0.3s;
      }
      .menu-icon span:nth-child(1) {
        width: 28px;
      }
      .menu-icon span:nth-child(2) {
        width: 20px;
        margin-left: 8px;
      }
      .menu-icon span:nth-child(3) {
        width: 24px;
        margin-left: 4px;
      }
      .menu-icon:hover span {
        background: #fff;
      }

      /* Live feed ticker at top */
      .live-ticker {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 32px;
        background: rgba(0, 0, 0, 0.7);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        z-index: 200;
        display: flex;
        align-items: center;
        overflow: hidden;
      }
      .live-dot {
        width: 6px;
        height: 6px;
        background: #ff3b3b;
        border-radius: 50%;
        margin: 0 10px 0 16px;
        animation: pulse-dot 1.5s infinite;
        flex-shrink: 0;
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .live-label {
        font-size: 9px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #ff3b3b;
        margin-right: 16px;
        flex-shrink: 0;
      }
      .ticker-track {
        display: flex;
        animation: scroll-ticker 360s linear infinite;
        white-space: nowrap;
      }
      @keyframes scroll-ticker {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      .ticker-item {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.55);
        margin-right: 48px;
        flex-shrink: 0;
      }
      .ticker-item .country-tag {
        color: rgba(100, 180, 255, 0.8);
        margin-right: 8px;
        font-weight: 600;
      }

      /* Country info panel */
      .info-panel {
        position: fixed;
        right: 36px;
        bottom: 40px;
        width: 380px;
        max-height: 60vh;
        background: rgba(8, 8, 16, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 150;
        padding: 28px;
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.4s,
          transform 0.4s;
        pointer-events: none;
        overflow-y: auto;
      }
      .info-panel.active {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      .info-panel .close-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: rgba(255, 255, 255, 0.4);
        font-size: 18px;
        transition: color 0.2s;
      }
      .info-panel .close-btn:hover {
        color: #fff;
      }
      .info-panel .country-name {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .info-panel .country-region {
        font-size: 10px;
        letter-spacing: 3px;
        color: rgba(255, 255, 255, 0.35);
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .info-panel .ai-index {
        display: flex;
        gap: 16px;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .ai-index .stat {
        flex: 1;
      }
      .ai-index .stat-val {
        font-size: 22px;
        font-weight: 600;
        color: rgba(100, 180, 255, 0.9);
      }
      .ai-index .stat-label {
        font-size: 9px;
        letter-spacing: 2px;
        color: rgba(255, 255, 255, 0.3);
        text-transform: uppercase;
        margin-top: 2px;
      }
      .info-panel .news-item {
        padding: 12px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .news-item .news-source {
        font-size: 9px;
        letter-spacing: 2px;
        color: rgba(100, 180, 255, 0.6);
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .news-item .news-title {
        font-size: 13px;
        font-weight: 500;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.85);
        margin-bottom: 4px;
      }
      .news-item .news-time {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.25);
      }

      /* Hover tooltip */
      .hover-tooltip {
        position: fixed;
        z-index: 300;
        background: rgba(8, 8, 16, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 10px 16px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        white-space: nowrap;
      }
      .hover-tooltip.visible {
        opacity: 1;
      }
      .hover-tooltip .tt-name {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .hover-tooltip .tt-count {
        font-size: 10px;
        color: rgba(100, 180, 255, 0.7);
        margin-top: 2px;
      }

      /* Stats bar at bottom */
      .stats-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        z-index: 50;
        background: rgba(255, 255, 255, 0.03);
      }
      .stats-bar .fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(
          90deg,
          rgba(60, 120, 255, 0.6),
          rgba(100, 200, 255, 0.4)
        );
        transition: width 1s ease;
      }

      /* Country count */
      .country-counter {
        position: fixed;
        top: 32px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        text-align: center;
        pointer-events: none;
        margin-top: 4px;
      }
      .country-counter .num {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .country-counter .label {
        font-size: 9px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.3);
      }

      /* Scrollbar */
      .info-panel::-webkit-scrollbar {
        width: 4px;
      }
      .info-panel::-webkit-scrollbar-track {
        background: transparent;
      }
      .info-panel::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
      }

      @media (max-width: 600px) {
        .info-panel {
          left: 12px;
          right: 12px;
          width: auto;
          bottom: 12px;
        }
        .main-title h2 {
          font-size: 28px;
        }
        .brand h1 {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="live-ticker">
      <div class="live-dot"></div>
      <span class="live-label">Live</span>
      <div class="ticker-track" id="tickerTrack"></div>
    </div>

    <div class="brand">
      <h1>GLOBAL <em>AI</em><br />PULSE</h1>
    </div>

    <div class="country-counter">
      <div class="num" id="countryCount">0</div>
      <div class="label">Countries Tracked</div>
    </div>

    <div class="menu-icon" id="menuIcon">
      <span></span><span></span><span></span>
    </div>

    <div class="nav-arrow nav-left" id="navLeft">‹</div>
    <div class="nav-arrow nav-right" id="navRight">›</div>

    <div class="main-title">
      <h2>THE <em>ARTIFICIAL</em><br />INTELLIGENCE</h2>
      <div class="sub">Real-time global AI news aggregation</div>
    </div>

    <div class="foreword-link" id="foreword">EXPLORE FEED</div>

    <div class="info-panel" id="infoPanel">
      <div class="close-btn" id="closePanel">×</div>
      <div id="panelContent"></div>
    </div>

    <div class="hover-tooltip" id="tooltip">
      <div class="tt-name" id="ttName"></div>
      <div class="tt-count" id="ttCount"></div>
    </div>

    <div class="stats-bar"><div class="fill" id="statsFill"></div></div>

    <div id="globe-container"></div>
    <script src="./scene.bundle.js"></script>
  </body>
</html>
