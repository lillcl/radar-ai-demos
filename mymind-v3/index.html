<section class="card pad">${section('Your little wins','Every completed activity counts')}<div class="pillars">${[['breathing','🌬️','Calm'],['nutrition','💧','Nourish'],['movement','🧘','Move'],['journal','📖','Reflect']].map(([id,e,n])=>`<button class="pillar ${isDone(id)?'complete':''}" data-act="open" data-id="${id}"><span class="pict">${e}</span><strong>${n}</strong><span class="dots">${isDone(id)?'● ● ●':'● ○ ○'}</span></button>`).join('')}</div></section>
<div class="grid2"><section class="card pad">${section('Today’s routine','Your plan, your pace',`<button class="link" data-act="nav" data-id="plan">Edit →</button>`)}${state.plans.slice(0,5).map(id=>`<div class="itemrow"><button class="check ${isDone(id)?'done':''}" data-act="check" data-id="${id}" aria-label="Toggle ${modMap[id]?.name||id}">${isDone(id)?I('check',17):''}</button><div style="flex:1;min-width:0"><strong>${modMap[id]?.name||id}</strong><small>${modMap[id]?.sub||''}</small></div><button class="round-arrow" data-act="open" data-id="${id}">→</button></div>`).join('')}</section><section class="card pad">${section('A growing journey','Tiny habits, real consistency')}<div style="display:flex;align-items:center;gap:15px"><img src="${img('streak_new.webp')}" alt="Happy capybara beneath glowing stars" style="width:118px;height:118px;object-fit:cover;border-radius:20px"><div><div style="font-size:39px;font-weight:1000;line-height:1">${streak()}</div><div class="muted">day streak</div><div class="tip" style="margin-top:8px">One activity makes a day count.</div></div></div><button class="link" data-act="nav" data-id="record" style="margin-top:15px">View achievements →</button></section></div>
<section>${section('Pick a small moment','Explore something that feels right') }<div class="training-grid">${['breathing','sleep','movement'].map(id=>tile(modMap[id])).join('')}</div></section>`}
function tile(m){return `<button class="training-card" data-act="open" data-id="${m.id}"><img loading="lazy" src="${img(m.image)}" alt="Capybara illustration for ${m.name}"><span class="tc-body"><span><strong>${m.name}</strong><small>${m.sub}</small></span><span class="round-arrow">→</span></span></button>`}
function train(){const cats=['All','Calm','Sound','Rest','Focus','Body','Reflect'];const items=moduleDefs.filter(x=>filter==='All'||x.type===filter);return `<div class="illustrated" style="min-height:240px"><img src="${img('meditation_new.webp')}" alt="Capybara meditating in a moonlit garden"><div class="hero-inner" style="min-height:240px"><div class="overline">12 WAYS TO FEEL BETTER</div><h2>Choose your<br><em>moment.</em></h2><p>No pressure to do them all.</p></div></div><div class="category-grid">${cats.map(c=>`<button class="category ${filter===c?'sel':''}" data-act="filter" data-id="${c}">${c}</button>`).join('')}</div><div class="training-grid">${items.map(tile).join('')}</div>`}
function plan(){return `<section class="illustrated" style="min-height:240px"><img src="${img('movement_new.webp')}" alt="Capybara taking a gentle walk in the forest"><div class="hero-inner" style="min-height:240px"><div class="overline">YOUR OWN WAY</div><h2>A plan that<br><em>fits you.</em></h2><p>Build a routine from any practice.</p></div></section><div class="grid2"><section class="card pad">${section('Your daily routine',`${countDone()} of ${state.plans.length} done`)}${state.plans.map(id=>`<div class="itemrow"><button class="check ${isDone(id)?'done':''}" data-act="check" data-id="${id}">${isDone(id)?I('check',17):''}</button><div style="flex:1"><strong>${modMap[id]?.name}</strong><small>${modMap[id]?.type} · Your pace</small></div><button class="link" data-act="removePlan" data-id="${id}" aria-label="Remove from plan">×</button></div>`).join('')||'<p class="muted">Your plan is empty. Pick an activity below.</p>'}</section><section class="card pad">${section('Add a little step','Tap to add or remove it')}<div class="plan-picker">${moduleDefs.map(m=>`<button class="plan-pill ${state.plans.includes(m.id)?'on':''}" data-act="togglePlan" data-id="${m.id}">${m.emoji} ${m.name}</button>`).join('')}</div><p class="tip" style="margin-top:16px">Plan items appear on Home. Completing an activity updates Record automatically.</p></section></div>`}
function streak(){let n=0;for(let i=0;i<90;i++){let day=addDays(-i);if((state.done[day]||[]).length)n++;else if(i===0)continue;else break}return n}
function weekDays(){return Array.from({length:7},(_,i)=>addDays(i-6))}
function achievements(){const sessions=state.sessions.length,journal=state.journal.length,days=streak(),sleep=state.sleepHistory.length;return [sessions>=1,days>=7,sleep>=7,journal>=1]}
function record(){const badges=achievements();const sessions=state.sessions.filter(s=>s.date===today()).length;return `<section class="illustrated" style="min-height:242px"><img src="${img('streak_new.webp')}" alt="Capybara with glowing achievement stars"><div class="hero-inner" style="min-height:242px"><div class="overline">YOU SHOWED UP</div><h2>${streak()} day<br><em>streak.</em></h2><p>Your small steps are adding up.</p></div></section><div class="grid2"><section class="card pad">${section('This week','A simple view of your activity')}<div style="display:flex;gap:6px;justify-content:space-between">${weekDays().map(d=>{let v=(state.done[d]||[]).length;return `<div style="display:grid;gap:8px;justify-items:center;font-size:11px;color:#a9c7da"><span style="display:grid;place-items:center;height:35px;width:35px;border-radius:13px;background:${v?'#a2efdb':'#14374d'};color:${v?'#063e44':'#9cb8c9'}">${v?I('check',16):'·'}</span>${new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'short'}).slice(0,2)}</div>`}).join('')}</div><div style="margin-top:20px;display:flex;gap:14px"><div class="soft-card" style="flex:1;text-align:center"><strong style="display:block;font-size:29px;color:var(--mint)">${doneToday().length}</strong><small class="muted">Activities today</small></div><div class="soft-card" style="flex:1;text-align:center"><strong style="display:block;font-size:29px;color:var(--mint)">${sessions}</strong><small class="muted">Sessions today</small></div></div></section><section class="card pad">${section('Little wins','Earned through your activities')}<div class="ach-grid">${['First step','7-day streak','Sleep tracker','Reflection'].map((a,i)=>`<div class="ach ${badges[i]?'':'locked'}"><img src="${img('badge_'+(i+1)+'.webp')}" alt="${a} achievement badge">${a}</div>`).join('')}</div><p class="tip" style="margin-top:12px">Dim badges unlock when you complete the corresponding activity.</p></section></div><section class="card pad">${section('Your journal',`${state.journal.length} reflections`,`<button class="link" data-act="open" data-id="journal">Write →</button>`)}${state.journal.length?state.journal.slice().reverse().slice(0,3).map(j=>`<div class="historyrow"><div class="date">${safe(j.date.slice(5))}</div><div style="flex:1"><strong>${safe(j.text.length>95?j.text.slice(0,95)+'…':j.text)}</strong><small>${safe(j.prompt)}</small></div><button class="link" data-act="deleteJournal" data-id="${j.date}|${j.text.length}">×</button></div>`).join(''):'<p class="muted">Your private notes will appear here.</p>'}</section><section class="card pad">${section('Sleep patterns','Your last seven logged nights',`<button class="link" data-act="open" data-id="sleep">Log sleep →</button>`)}${sleepBars()}</section>`}
function sleepBars(){const hist=state.sleepHistory.slice(-7);return `<div class="bars">${hist.map((h,i)=>`<div class="barcol ${i===hist.length-1?'today':''}"><div class="bartrack"><div class="barfill" style="height:${Math.min(100,h.hours/10*100)}%"></div></div><span>${new Date(h.date+'T12:00:00').toLocaleDateString('en',{weekday:'short'}).slice(0,1)}</span></div>`).join('')}</div><div class="tip" style="margin-top:12px">${hist.length?`Average ${Math.round(hist.reduce((a,b)=>a+b.hours,0)/hist.length*10)/10} h · Logged hours, not a sleep-quality score.`:'Log your first night to see patterns.'}</div>`}
function settings(){return `<section class="card pad">${section('Your name')}<input class="field" maxlength="32" id="nameInput" value="${safe(state.settings.name)}" aria-label="Display name"><div style="height:20px"></div>${section('Accessibility & sound')}<div class="checkline ${state.settings.reduceMotion?'sel':''}" role="button" tabindex="0" data-act="reduced"><span class="circle">${state.settings.reduceMotion?I('check',16):''}</span><div class="grow"><strong>Reduced motion</strong><small>Remove decorative movement</small></div></div><div class="sound-mix"><strong>Audio volume</strong><input aria-label="Audio volume" type="range" min="0" max="100" value="${state.settings.volume}" id="prefVolume"></div><p class="tip">Audio sessions are synthesized inside the browser. Lower the volume before trying them.</p></section><section class="card pad">${section('Your data')}<p class="muted" style="margin-bottom:15px">This demo stores records only in this browser. No account, cloud sync or AI health assessment is connected.</p><div class="two-actions"><button class="outline" data-act="export">Export records</button><button class="outline" data-act="reset">Reset demo</button></div></section>`}
// Specialized training experiences: each activity uses an interaction suited to its purpose.
function moduleHero(m,tag='YOUR LITTLE MOMENT') {return `<div class="module-cover"><img src="${img(m.image)}" alt="${safe(m.name)} capybara illustration"><div class="module-cover-copy"><span class="overline">${tag}</span><h2>${safe(m.name)}</h2><p>${safe(m.sub)}</p></div><button class="back-cover" data-act="closeModule" aria-label="Back to Train">${I('back',20)}</button></div>`}
function durationPills(opts,sel=3,prefix='duration'){return `<div class="seg" role="group" aria-label="Session length">${opts.map(n=>`<button class="${sel===n?'sel':''}" data-act="${prefix}" data-id="${n}">${n} min</button>`).join('')}</div>`}
let durations={breathing:3,meditation:5,focus:15,binaural:10,nature:10}, modes={binaural:'Calm',nature:'Rain'}, journalPrompts=['One small good thing today?','What is on your mind?','What do you need tomorrow?'],voiceGuided=false;
function clockVisual(title,sub){return `<div class="clock-play"><div class="run-ring" id="runRing" style="--ring:0%"><img class="cap-runner" id="capRunner" src="${img('runner.webp')}" alt="Tiny capybara running around your progress circle"><div class="ring-center"><div class="mode" id="clockPhase">${title}</div><div class="sub" id="clockDetail">${sub}</div><div class="clock-percent" id="clockPercent">0%</div></div></div><div class="clock-controls"><button class="outline" data-act="clockReset">${I('back',17)} Reset</button><button class="primary" id="clockAction" data-act="clockToggle">${I('play',17)} Begin</button><button class="outline" data-act="clockFinish">Finish ${I('check',15)}</button></div></div>`}
function breathing(){return `${moduleHero(modMap.breathing,'A BREATH AT A TIME')}<section class="card pad">${section('Follow the little runner','Breathe naturally and gently')}${durationPills([1,3,5,10],durations.breathing)}<div class="breath-orb-wrap"><div class="orb" id="breathOrb">Inhale</div></div>${clockVisual('Ready','In for 4 · Out for 6')}<p class="tip" style="text-align:center">Sit comfortably. Avoid forcing or holding your breath; stop if dizzy.</p></section>`}
const meditationCues=['Sit comfortably. Notice the ground supporting you.','Bring your attention to your natural breath.','If your mind wanders, notice it without judgment.','Gently return to the sensations of breathing.','Close with kindness toward yourself.'];
function meditation(){return `${moduleHero(modMap.meditation,'JUST BE HERE')}<section class="card pad">${section('A quiet moment','Gentle prompts change as you practice')}${durationPills([3,5,10,15],durations.meditation)}<div class="guidance-card"><span>✿</span><strong id="meditationCue">${meditationCues[0]}</strong><div class="tiny">No perfect way to meditate.</div></div>${clockVisual('Settle in','Your pace, your space')}<p class="tip" style="text-align:center">Meditation is optional. You can keep your eyes open and pause at any time.</p></section>`}
function soundModule(id){const m=modMap[id],b=id==='binaural', options=b?['Calm','Focus','Rest']:['Rain','Forest','Ocean'];return `${moduleHero(m,b?'LISTEN, DON’T STRAIN':'BUILD YOUR SOUND WORLD')}<div class="grid2"><section class="card pad">${section(b?'Choose your listening mood':'Blend your nature sounds')}${b?`<div class="seg" role="group" aria-label="Listening mode">${options.map(n=>`<button class="${modes[id]===n?'sel':''}" data-act="audioMode" data-id="${n}">${n}</button>`).join('')}</div>`:`<div class="seg" role="group" aria-label="Nature sound"><button class="${modes.nature==='Rain'?'sel':''}" data-act="audioMode" data-id="Rain">Rain</button><button class="${modes.nature==='Forest'?'sel':''}" data-act="audioMode" data-id="Forest">Forest</button><button class="${modes.nature==='Ocean'?'sel':''}" data-act="audioMode" data-id="Ocean">Ocean</button></div>`}<div class="sound-art"><div class="sound-waves"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="sound-buddy"><img src="${img('runner.webp')}" alt="Capybara listening peacefully"></div></div>${durationPills([5,10,20,30],durations[id])}${clockVisual('Listening','A gentle sound break')}</section><section class="card pad">${section('Your sound','Keep it gentle')}<div class="sound-mix"><strong>${I('volume',18)} Volume</strong><input id="playVolume" type="range" min="0" max="70" value="${state.settings.volume}" aria-label="Sound volume"></div><div class="hint">${b?'Use stereo headphones at a comfortable volume. Binaural beats use different tones in each ear. Evidence for specific focus or relaxation benefits is mixed.':'Synthetic background sound, made in your browser. Choose whichever texture feels pleasant.'}</div><p class="tip" style="margin-top:13px">These are demo-generated sounds, not professionally recorded audio.</p></section></div>`}
function getBedHours(a,b){let [h,m]=a.split(':').map(Number),[w,n]=b.split(':').map(Number);let v=(w*60+n)-(h*60+m);if(v<=0)v+=1440;return v/60}
function bedtimeChecklist(){return ['Dim the lights','Put screens aside','Prepare a restful room','Try gentle relaxation'].map((s,i)=>`<button class="checkline ${state.bedChecklist[i]?'sel':''}" data-act="bedcheck" data-id="${i}" aria-pressed="${state.bedChecklist[i]}"><span class="circle">${state.bedChecklist[i]?I('check',16):''}</span><div class="grow"><strong>${s}</strong></div></button>`).join('')}
function sleep(){let hours=getBedHours(state.bedtime,state.wake);const avg=state.sleepHistory.length?(state.sleepHistory.reduce((s,x)=>s+x.hours,0)/state.sleepHistory.length).toFixed(1):null;return `${moduleHero(modMap.sleep,'SLEEP WELL, WAKE SOFTLY')}<div class="grid2"><section class="card pad">${section('Last night','Log when you went to bed and woke up')}<div class="formgrid"><label><span class="label-sm">Bedtime</span><input class="field" id="bedtime" type="time" value="${state.bedtime}"></label><label><span class="label-sm">Woke up</span><input class="field" id="wake" type="time" value="${state.wake}"></label></div><div class="sleep-total"><span>🌙</span><strong id="sleepDuration">${hours.toFixed(1)} h</strong><small>Time in bed</small></div><button class="primary full" data-act="logSleep">${I('check',18)} Log last night</button></section><section class="card pad">${section('Your sleep pattern',avg?`${avg} hours average (logged)`:'Track your first night')}${sleepBars()}<div class="hint" style="margin-top:14px">The pattern shows estimated time in bed, not measured sleep.</div></section></div><section class="card pad">${section('Tonight’s little checklist',`${state.bedChecklist.filter(Boolean).length} of 4 ready`)}${bedtimeChecklist()}</section>`}
function macroTotals(){let p=0,c=0,f=0;for(const meal of meals){if(state.meals[meal.id]){p+=meal.p;c+=meal.c;f+=meal.f}}return {p,c,f,kcal:p*4+c*4+f*9}}
function macroMetric(value,goal,label,color){return `<div class="macro-metric"><strong>${label}</strong><div><span class="metric">${value}g</span><span class="unit"> / ${goal}g</span></div><div class="meter"><span style="background:${color};width:${Math.min(100,value/goal*100)}%"></span></div></div>`}
function nutrition(){const m=macroTotals(),checked=meals.filter(x=>state.meals[x.id]).length;return `${moduleHero(modMap.nutrition,'ONE NOURISHING STEP')}<section class="card pad">${section('Your food checklist',`${checked} of ${meals.length} sample meals logged`)}<div class="foodgrid">${meals.map(a=>`<button class="food-card ${state.meals[a.id]?'on':''}" data-act="meal" data-id="${a.id}" aria-pressed="${!!state.meals[a.id]}"><span class="foodcheck">${state.meals[a.id]?'✓':''}</span><span class="foodicon">${a.emoji}</span><strong>${a.label}</strong><small>${a.food}</small></button>`).join('')}</div></section><section class="card pad">${section('Estimated nutrition',`${m.kcal} kcal · illustrative goals`)}<div class="macros">${macroMetric(m.p,100,'Protein','#fda9b5')}${macroMetric(m.c,250,'Carbs','#f8c67d')}${macroMetric(m.f,70,'Fats','#c0a7ff')}</div><div class="hint" style="margin-top:15px">Demo portion estimates only. These totals update from your checked sample meals, not from food recognition or an individualized nutrition plan.</div></section><section class="card pad">${section('Water today',`${state.water} of 8 cups`)}<div class="droplets">${Array.from({length:8},(_,i)=>`<button class="droplet ${i<state.water?'active':''}" data-act="water" data-id="${i+1}" aria-label="Set water to ${i+1} cups">💧</button>`).join('')}</div></section>`}
function poseFigure(idx){const arms=[['M65 58 L42 20','M65 58 L88 20'],['M64 57 L88 65','M64 57 L44 76'],['M63 55 L42 23','M63 55 L85 46'],['M65 57 L55 77','M65 57 L80 79'],['M65 55 L24 38','M65 55 L106 38']][idx%5],spine=idx===3?'M65 48 Q48 62 53 89':idx===2?'M65 48 Q50 68 53 92':'M65 48 L65 92';return `<svg viewBox="0 0 130 140" role="img" aria-label="Simple movement direction illustration"><circle cx="65" cy="30" r="13" fill="none" stroke="#b3ffe2" stroke-width="7"/><g fill="none" stroke="#b3ffe2" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"><path d="${spine}"/><path d="${arms[0]}"/><path d="${arms[1]}"/><path d="M65 92 L45 125 M65 92 L88 125"/></g></svg>`}
function movement(kind='movement'){const isQ=kind==='qigong',steps=isQ?qigongSteps:stretchSteps,idx=isQ?qIndex:stepIndex,st=steps[idx],completed=isQ?(state.qSteps||[]):[...stretchDone],n=completed.length;return `${moduleHero(modMap[kind],isQ?'SLOW AND STEADY':'MOVE WITH YOUR BUDDY')}<section class="card pad">${section(isQ?'Gentle qigong flow':'Follow each stretch',`${n} of ${steps.length} movements done`)}<div class="routine-progress"><span style="width:${n/steps.length*100}%"></span></div><div class="pose-scene"><img src="${img(st.image)}" alt="Capybara with illustrated landscape"><span class="motion-arrow" aria-hidden="true">${st.dir}</span><div class="pose-figure">${poseFigure(idx)}</div><div class="pose-copy"><span>STEP ${idx+1} OF ${steps.length}</span><strong>${st.name}</strong><span>${st.instruction}</span></div></div><div class="stepdots">${steps.map((s,i)=>`<button class="${completed.includes(i)?'done':i===idx?'now':''}" data-act="step" data-id="${kind}|${i}" aria-label="${s.name}">${completed.includes(i)?'✓':i+1}</button>`).join('')}</div><div class="two-actions" style="justify-content:center"><button class="outline" data-act="prevStep" data-id="${kind}" ${idx===0?'disabled':''}>← Previous</button><button class="primary" data-act="nextStep" data-id="${kind}">${completed.includes(idx)?'Next movement':'Done — next'} →</button></div><p class="tip">Illustrations are friendly activity cues, not precise anatomical demonstrations. Move only within a comfortable range.</p></section>`}
function journal(){return `${moduleHero(modMap.journal,'A LITTLE SPACE FOR YOU')}<section class="card pad">${section('Your thoughts','Choose a gentle prompt, or write freely')}<div class="plan-picker">${journalPrompts.map((p,i)=>`<button class="plan-pill ${journalPrompt===p?'on':''}" data-act="prompt" data-id="${i}">${p}</button>`).join('')}</div><form id="journalForm"><label for="journalDraft" class="label-sm" style="margin-top:16px">${safe(journalPrompt)}</label><textarea id="journalDraft" class="field" placeholder="Write what feels right..." maxlength="2500" required>${safe(draft)}</textarea><button class="primary full" type="submit">${I('check',18)} Save reflection</button></form></section>`}
function gratitude(){return `${moduleHero(modMap.gratitude,'NOTICE THE LITTLE THINGS')}<section class="card pad">${section('Three things to remember','A short reflection, no pressure')}<form id="gratitudeForm"><label class="label-sm">A moment</label><input class="field" id="g1" maxlength="160" placeholder="Something that made you smile" required><label class="label-sm" style="margin-top:15px">A person</label><input class="field" id="g2" maxlength="160" placeholder="Someone you appreciate"><label class="label-sm" style="margin-top:15px">Something about yourself</label><input class="field" id="g3" maxlength="160" placeholder="A small thing you did well"><button class="primary full" type="submit">${I('heart',18)} Keep these little moments</button></form></section>`}
function focus(){return `${moduleHero(modMap.focus,'ONE TASK AT A TIME')}<div class="grid2"><section class="card pad">${section('What matters right now?','Name one thing, then begin')}<input class="field" id="focusGoal" maxlength="100" placeholder="One task for this session" value="${safe(focusDraft)}">${durationPills([5,15,25,45],durations.focus)}${clockVisual('Focus time','One thing at a time')}</section><section class="card pad">${section('Park a distracting thought','Write it down to return to later')}<form id="distractionForm" class="inline-form"><input class="field" id="distraction" maxlength="130" placeholder="Remember to..." aria-label="Distraction note"><button class="primary" type="submit">${I('plus',18)}</button></form><div id="distractionList">${distractions.map(x=>`<div class="historyrow">🍃 ${safe(x)}</div>`).join('')}</div></section></div>`}
function memory(){return `${moduleHero(modMap.brain,'PLAY WITH YOUR ATTENTION')}<section class="card pad" style="text-align:center">${section('Little memory game','Watch the pattern, then tap it back')}<div class="soft-card" style="display:inline-block;margin:10px auto"><strong id="memoryStatus">Ready to play?</strong><p class="muted" id="memoryRound">Round ${memoryRound+1}</p></div><div class="simon">${[0,1,2,3].map(i=>`<button data-act="memoryTap" data-id="${i}" aria-label="Color ${i+1}"></button>`).join('')}</div><button class="primary" data-act="memoryStart">${I('play',17)} ${memoryRound?'Restart game':'Start game'}</button><button class="outline" style="margin-left:8px" data-act="memoryFinish">Finish</button><div class="tip" style="margin-top:17px">A playful skill practice, not a test of IQ or general cognitive ability.</div></section>`}
function renderModule(){switch(active){case 'breathing':return breathing();case 'meditation':return meditation();case 'binaural':case 'nature':return soundModule(active);case 'sleep':return sleep();case 'focus':return focus();case 'brain':return memory();case 'movement':case 'qigong':return movement(active);case 'nutrition':return nutrition();case 'journal':return journal();case 'gratitude':return gratitude();default:return train()}}
function render(){document.body.classList.toggle('reduce-motion',state.settings.reduceMotion);$('#app').innerHTML=frame(active?renderModule():({home,train,plan,record,settings}[tab]||home)());if(clock)refreshClock();}
function resetClock(){stopClock();const id=active;const min=durations[id]||3;clock={id,total:min*60,remaining:min*60,running:false,timer:null,last:0};refreshClock();}
function refreshClock(){if(!clock||!$('#runRing'))return;let p=Math.max(0,Math.min(100,100*(clock.total-clock.remaining)/clock.total));$('#runRing').style.setProperty('--ring',p.toFixed(1)+'%');if($('#clockPercent'))$('#clockPercent').textContent=Math.floor(p)+'%';const secs=Math.ceil(clock.remaining);const detail=$('#clockDetail');if(detail)detail.textContent=`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')} remaining`;const runner=$('#capRunner');if(runner){let a=(-Math.PI/2)+2*Math.PI*p/100;const radius=113;runner.style.transform=`translate(-50%,-50%) translate(${Math.cos(a)*radius}px,${Math.sin(a)*radius}px)`}const phase=$('#clockPhase');if(phase){if(clock.id==='breathing'){const elapsed=clock.total-clock.remaining;phase.textContent=Math.floor(elapsed%10)<4?'Inhale':'Exhale';$('#breathOrb')?.classList.toggle('big',Math.floor(elapsed%10)<4);$('#breathOrb')?.classList.toggle('small',Math.floor(elapsed%10)>=4);if($('#breathOrb'))$('#breathOrb').textContent=phase.textContent}else if(clock.id==='meditation'){let n=Math.min(4,Math.floor((clock.total-clock.remaining)/Math.max(1,clock.total/5)));phase.textContent=['Arrive','Notice','Breathe','Return','Close'][n];if($('#meditationCue'))$('#meditationCue').textContent=meditationCues[n]}else phase.textContent=clock.id==='focus'?'Stay with it':'Enjoy the sound'}const button=$('#clockAction');if(button)button.innerHTML=clock.running?`${I('pause',17)} Pause`:`${I('play',17)} ${clock.remaining===clock.total?'Begin':'Resume'}`}
function toggleClock(){if(!clock)resetClock();if(clock.running){clock.running=false;clearInterval(clock.timer);refreshClock();if(audio)audio.suspend().catch(()=>{});return}clock.running=true;clock.last=performance.now();if(['binaural','nature'].includes(clock.id)){if(audio){audio.resume().catch(()=>{})}else startSound()}clock.timer=setInterval(()=>{if(!clock?.running)return;const now=performance.now();clock.remaining=Math.max(0,clock.remaining-(now-clock.last)/1000);clock.last=now;refreshClock();if(clock.remaining<=0){const id=clock.id,m=clock.total/60;stopClock();stopAudio();markDone(id,m)}},150);refreshClock()}
function finishClock(){if(!clock)return;let elapsed=(clock.total-clock.remaining)/60;const id=clock.id;if(elapsed<0.5){toast('Try practicing for at least 30 seconds first.');return}stopClock();stopAudio();markDone(id,Math.round(elapsed*10)/10)}
function prepareAudio(){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx){toast('Audio is not supported in this browser');return null}try{audio=new Ctx();return audio}catch(e){toast('Audio unavailable');return null}}
function startSound(){const ctx=prepareAudio();if(!ctx)return;const vol=Math.min(.08,(Number(state.settings.volume)||0)/1000);let out=ctx.createGain();out.gain.value=vol;out.connect(ctx.destination);audioNodes.push(out);if(active==='binaural'){const diffs={Calm:6,Focus:12,Rest:4};const d=diffs[modes.binaural]||6;[190,190+d].forEach((freq,i)=>{let osc=ctx.createOscillator(),pan=ctx.createStereoPanner();osc.type='sine';osc.frequency.value=freq;pan.pan.value=i===0?-1:1;osc.connect(pan).connect(out);osc.start();audioNodes.push(osc)})}else{const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),samples=b.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=(Math.random()*2-1);const s=ctx.createBufferSource(),filter=ctx.createBiquadFilter();s.buffer=b;s.loop=true;filter.type='lowpass';filter.frequency.value={Rain:1500,Forest:850,Ocean:420}[modes.nature]||900;s.connect(filter).connect(out);s.start();audioNodes.push(s)}}
async function memoryNext(){if(active!=='brain')return;memoryBusy=true;memoryIndex=0;memorySeq.push(Math.floor(Math.random()*4));memoryRound++;const info=$('#memoryStatus');if(info)info.textContent='Watch the lights…';const r=$('#memoryRound');if(r)r.textContent=`Round ${memoryRound}`;await new Promise(r=>setTimeout(r,350));for(const n of memorySeq){if(active!=='brain')return;const el=$(`[data-act="memoryTap"][data-id="${n}"]`);if(!el)return;el.classList.add('lit');await new Promise(r=>setTimeout(r,580));el.classList.remove('lit');await new Promise(r=>setTimeout(r,240))}memoryBusy=false;if($('#memoryStatus'))$('#memoryStatus').textContent='Now repeat the pattern';}
function memoryTap(n){if(memoryBusy||!memorySeq.length)return;const el=$(`[data-act="memoryTap"][data-id="${n}"]`);el?.classList.add('lit');setTimeout(()=>el?.classList.remove('lit'),180);if(n!==memorySeq[memoryIndex]){memoryBusy=true;if($('#memoryStatus'))$('#memoryStatus').textContent=`Good try! You reached round ${memoryRound}.`;setTimeout(()=>{memoryBusy=false;memorySeq=[];memoryIndex=0;if($('#memoryStatus'))$('#memoryStatus').textContent='Press Start to try again.'},900);return}memoryIndex++;if(memoryIndex===memorySeq.length){memoryBusy=true;if($('#memoryStatus'))$('#memoryStatus').textContent='Beautifully remembered!';setTimeout(()=>{if(active==='brain')memoryNext()},900)}}
function saveJournal(text,prompt){let j={date:today(),text:text.trim(),prompt};if(!j.text)return;state.journal.push(j);state.demo=false;save();draft='';markDone('journal');toast('Your reflection is saved privately')}
function logSleep(){const h=getBedHours(state.bedtime,state.wake);if(h<1||h>16){toast('Please enter plausible sleep times (1–16 hours).');return}state.sleepHistory=state.sleepHistory.filter(x=>x.date!==today());state.sleepHistory.push({date:today(),hours:Math.round(h*10)/10,bedtime:state.bedtime,wake:state.wake});state.demo=false;save();markDone('sleep');toast('Your sleep record is saved')}
function rememberLocal(){state.demo=false;save()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='mymind-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),700)}
const actionHandlers={
nav:b=>navigate(b.dataset.id),open:b=>openModule(b.dataset.id),closeModule:()=>{stopClock();stopAudio();active=null;render()},
filter:b=>{filter=b.dataset.id;render()},mood:b=>{state.mood=b.dataset.id;rememberLocal();render()},
check:b=>toggleDone(b.dataset.id),togglePlan:b=>{let id=b.dataset.id;if(state.plans.includes(id))state.plans=state.plans.filter(x=>x!==id);else state.plans.push(id);rememberLocal();render()},removePlan:b=>{state.plans=state.plans.filter(x=>x!==b.dataset.id);rememberLocal();render()},
meal:b=>{const k=b.dataset.id;state.meals[k]=!state.meals[k];rememberLocal();if((Object.values(state.meals).some(Boolean)||state.water>0)&&!isDone('nutrition')){state.done[today()]=[...doneToday(),'nutrition'];save()}if(!Object.values(state.meals).some(Boolean)&&state.water===0){state.done[today()]=doneToday().filter(x=>x!=='nutrition');save()}render()},
water:b=>{state.water=state.water===Number(b.dataset.id)?0:Number(b.dataset.id);rememberLocal();if(state.water>0&&!isDone('nutrition')){state.done[today()]=[...doneToday(),'nutrition'];save()}if(state.water===0&&!Object.values(state.meals).some(Boolean)){state.done[today()]=doneToday().filter(x=>x!=='nutrition');save()}render()},
bedcheck:b=>{let i=Number(b.dataset.id);state.bedChecklist[i]=!state.bedChecklist[i];rememberLocal();render()},logSleep:()=>logSleep(),
prompt:b=>{journalPrompt=journalPrompts[+b.dataset.id];render()},
step:b=>{let[k,n]=b.dataset.id.split('|');if(k==='qigong')qIndex=+n;else stepIndex=+n;render()},
prevStep:b=>{if(b.dataset.id==='qigong')qIndex=Math.max(0,qIndex-1);else stepIndex=Math.max(0,stepIndex-1);render()},
nextStep:b=>{const k=b.dataset.id,isQ=k==='qigong',steps=isQ?qigongSteps:stretchSteps,idx=isQ?qIndex:stepIndex;if(isQ){state.qSteps=state.qSteps||[];if(!state.qSteps.includes(idx))state.qSteps.push(idx)}else stretchDone.add(idx);if((isQ?state.qSteps.length:stretchDone.size)>=steps.length){if(isQ)state.qSteps=[];markDone(k);return}if(isQ)qIndex=Math.min(steps.length-1,idx+1);else stepIndex=Math.min(steps.length-1,idx+1);render()},
duration:b=>{durations[active]=Number(b.dataset.id);stopClock();stopAudio();render()},clockToggle:()=>toggleClock(),clockReset:()=>{stopAudio();resetClock()},clockFinish:()=>finishClock(),
audioMode:b=>{modes[active]=b.dataset.id;stopAudio();stopClock();render()},
memoryStart:()=>{memoryRound=0;memorySeq=[];memoryIndex=0;memoryNext()},memoryTap:b=>memoryTap(+b.dataset.id),memoryFinish:()=>{if(memoryRound<1){toast('Start a round first');return}markDone('brain');memoryRound=0;memorySeq=[]},
deleteJournal:b=>{const [date,len]=b.dataset.id.split('|');let i=state.journal.findIndex(j=>j.date===date&&j.text.length===Number(len));if(i>=0){state.journal.splice(i,1);rememberLocal();render()}},
reduced:()=>{state.settings.reduceMotion=!state.settings.reduceMotion;rememberLocal();render()},export:()=>exportData(),reset:()=>{if(!confirm('Reset your MyMind demo records on this device?'))return;state=seed();state.demo=false;save();navigate('home');toast('Demo reset')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const cb=actionHandlers[b.dataset.act];if(cb)cb(b)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='journalDraft')draft=t.value;if(t.id==='focusGoal')focusDraft=t.value;if(t.id==='nameInput'){state.settings.name=t.value;rememberLocal()}if(t.id==='bedtime'||t.id==='wake'){state[t.id]=t.value;rememberLocal();const h=$('#sleepDuration');if(h)h.textContent=getBedHours(state.bedtime,state.wake).toFixed(1)+' h'}if(t.id==='prefVolume'||t.id==='playVolume'){state.settings.volume=+t.value;rememberLocal();if(audio){stopAudio();if(clock?.running)startSound()}}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='journalForm'){saveJournal($('#journalDraft')?.value||'',journalPrompt)}if(e.target.id==='gratitudeForm'){let items=['g1','g2','g3'].map(x=>$('#'+x)?.value.trim()).filter(Boolean);if(items.length){state.journal.push({date:today(),text:items.map((x,i)=>`${i+1}. ${x}`).join('\n'),prompt:'Three good things'});rememberLocal();markDone('gratitude');toast('Your gratitude note was saved')}}if(e.target.id==='distractionForm'){let t=$('#distraction').value.trim();if(t){distractions.push(t);$('#distraction').value='';const list=$('#distractionList');if(list)list.innerHTML=distractions.map(x=>`<div class="historyrow">🍃 ${safe(x)}</div>`).join('')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&active){stopClock();stopAudio();active=null;render()}});
window.addEventListener('pagehide',()=>{stopClock();stopAudio()});
render();
})();
</script></body></html>
